name: iOS unsigned build (AltStore / Sideloadly)

# Pașii sunt în kappado2000/ci-flutter/.github/workflows/ios-unsigned.yml (comun tuturor aplicațiilor).
on:
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    uses: kappado2000/ci-flutter/.github/workflows/ios-unsigned.yml@main
    with:
      ipa_name: MedRO
      # IPA-ul conține tokenul serverului asistentului: release-ul rămâne
      # draft (vizibil doar cu drept de scriere), nu se publică niciodată.
      draft: true
    secrets: inherit
