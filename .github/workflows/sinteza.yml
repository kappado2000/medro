name: Sinteza saptamanala (psihiatrie, medicina, stiinte, arta)

# Ciorna editiei este scrisa sambata dimineata de o rutina programata din
# abonamentul Claude (instructiuni: tool/sinteza_rutina.md), care o urca in
# sinteza/ciorne/. Fluxul acesta porneste la acel push: verifica sursele, ia
# imaginile, salveaza editia in repo si o publica pe Firebase Hosting, de unde o
# citesc aplicatia si pagina web hosting/sinteza/. Nu foloseste API-ul Claude,
# deci nu are cost.
on:
  push:
    branches: [main]
    paths:
      - 'sinteza/ciorne/**'
  workflow_dispatch: {}

# acelasi grup ca fluxul de date: amandoua scriu in main si publica hosting-ul
concurrency: date

jobs:
  sinteza:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # certificatele la zi pentru verificarea surselor
      - run: pip install certifi

      # daca prea putine articole trec de verificarea surselor, fluxul se
      # opreste aici si ramane editia de saptamana trecuta
      - name: Verifica sursele si construieste editia
        run: |
          ciorna=$(ls sinteza/ciorne/*.json | sort | tail -n 1)
          echo "Ciorna: $ciorna"
          python tool/build_sinteza.py --din-fisier "$ciorna" --forteaza

      - name: Salveaza editia in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosting/sinteza
          if git diff --cached --quiet; then
            echo "Editia nu s-a schimbat."
          else
            git commit -m "Sinteza: editia saptamanii"
            git pull --rebase
            git push
          fi

      # hosting/date/ nu este in repo; fara acest pas, publicarea ar sterge de
      # pe server datele aplicatiei
      - name: Pregateste si datele aplicatiei pentru publicare
        run: python tool/publica_date.py

      - name: Publica pe Firebase Hosting
        env:
          CONT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDRO_ASISTENT_2026 }}
        run: |
          if [ -z "$CONT" ]; then
            echo "::warning::Secretul FIREBASE_SERVICE_ACCOUNT_MEDRO_ASISTENT_2026 lipseste; editia nu a fost publicata."
            exit 0
          fi
          echo "$CONT" > "$RUNNER_TEMP/cont.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cont.json"
          npx --yes firebase-tools@latest deploy --only hosting --project medro-asistent-2026 --non-interactive
          rm -f "$RUNNER_TEMP/cont.json"
